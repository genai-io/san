name: Release

on:
  push:
    tags:
      - 'v*'
  # Dispatched on a tag ref by release-tag.yml after a release PR merges —
  # a GITHUB_TOKEN tag push cannot trigger this workflow's push event.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: false

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'

      - name: Install format tools
        run: make install-format-tools

      - name: Format check
        run: make format-check

      - name: Build binaries
        run: make release

      # SHA256SUMS is signed with the release key and checked against the
      # public key built into san, so a secret that no longer matches the
      # code fails here instead of shipping a release no client will install.
      - name: Sign checksums
        env:
          SAN_RELEASE_SIGNING_KEY: ${{ secrets.SAN_RELEASE_SIGNING_KEY }}
        run: |
          go run ./tools/releasekey sign bin/SHA256SUMS
          go run ./tools/releasekey verify bin/SHA256SUMS

      - name: Extract release notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          tag = os.environ["TAG_NAME"]
          text = Path("CHANGELOG.md").read_text()
          pattern = rf'(?ms)^## \[{re.escape(tag)}\].*?(?=^## \[|\Z)'
          match = re.search(pattern, text)
          if not match:
              raise SystemExit(f"release notes section not found for {tag}")
          Path("release-notes.md").write_text(match.group(0).strip() + "\n")
          PY

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            bin/san_*.tar.gz
            bin/san_*.zip
            bin/SHA256SUMS
            bin/SHA256SUMS.sig
            CHANGELOG.md
          body_path: release-notes.md
