name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release bot triggers CI on release/vX.Y.Z branches this way:
  # workflow_dispatch runs always execute, unlike pull_request runs on
  # GITHUB_TOKEN-created PRs (which are gated behind manual approval).
  workflow_dispatch:
  schedule:
    # Weekly, so an advisory published against a dependency already in go.mod
    # surfaces without waiting for the next pull request.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - name: Install dev tools
        run: make install-format-tools install-lint-tools
      - name: Format check
        run: make format-check
      - name: Build
        run: make build-all
      - name: Unit + integration tests (merged coverage)
        run: make cover
      - name: Vet + lint + layer check
        run: make lint

  vuln:
    name: Known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - name: govulncheck
        run: make vulncheck

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - name: Build
        run: go build ./cmd/san/
      - name: Test cmd/san and the shell layer (process, hooks, shell tool) — integration tests are Unix-only
        run: go test -count=1 ./cmd/san/... ./internal/proc/... ./internal/hook/... ./internal/tool/fs/...
      - name: Test PowerShell permission classification
        run: go test -count=1 -run 'PowerShell|BareShell' ./internal/setting/ ./internal/subagent/
      - name: Test PowerShell under both pwsh and Windows PowerShell 5.1
        run: go test -count=1 -v -run PowerShell ./internal/tool/fs/
      - name: A Windows with both Git Bash and PowerShell offers both, the second disabled
        run: go test -count=1 -v -run 'TestSecondShellShipsDisabled|TestBuiltinToolsAllRegistered' ./internal/setting/ ./internal/tool/
      - name: A Windows without Git Bash is given the PowerShell tool
        env:
          SAN_SHELL: powershell
        run: go test -count=1 -v -run 'TestShellToolFollowsSANShell|TestBuiltinToolsAllRegistered' ./internal/tool/
      - name: Smoke test — zip package
        run: |
          go build -o san.exe ./cmd/san/
          Compress-Archive -Path san.exe -DestinationPath san_windows_amd64.zip -Force
          Expand-Archive -Path san_windows_amd64.zip -DestinationPath extracted -Force
          .\extracted\san.exe version
